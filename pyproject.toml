[project]
name = "opencv_mediapipe_demo_collection"
version = "0.1.0"
description = "A collection of Python OpenCV and MediaPipe real-time computer vision demos."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "opencv-python",
    "opencv-contrib-python",
    "mediapipe",
    "numpy",
    "cvzone",
    "pyautogui",
    "pynput",
    "requests",
    "scipy",
    "ultralytics",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
